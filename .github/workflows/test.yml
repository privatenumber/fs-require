name: Test

on:
  push:
    branches: [develop]
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version-file: '.nvmrc'

    - name: Setup pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      with:
        version: 7
        run_install: true

    - name: Build
      run: pnpm build

    - name: Lint
      run: pnpm lint

    - name: Type check
      run: pnpm type-check

    - name: Test
      run: pnpm test

    - name: Test v12
      run: pnpm --use-node-version=12.22.12 test
